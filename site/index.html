<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>glyphcast playground</title>
<meta name="description" content="Video as colored glyphs in the browser with WebGL2.">
<style>
:root {
  --bg: #07090c;
  --panel: #0e1217;
  --line: #1d242c;
  --ink: #e8ecef;
  --muted: #8b949e;
  --accent: #f0a04b;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(1200px 600px at 70% -10%, #142030 0%, var(--bg) 60%); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 56px; }
header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
h1 { margin: 0; font: 700 34px/1 var(--mono); letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.tagline { margin: 6px 0 0; color: var(--muted); }
nav { display: flex; gap: 8px; }
a { color: var(--accent); }
.button, nav a, button, select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 14px; cursor: pointer; text-decoration: none;
}
.button:hover, nav a:hover, button:hover { border-color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.bar input[type="file"] { display: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 22px; margin-bottom: 14px; }
.controls label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.controls output { color: var(--ink); font-family: var(--mono); }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.screen { position: relative; background: #000; border-radius: 12px; overflow: hidden; display: grid; place-items: center; aspect-ratio: 16 / 9; }
.screen canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
.screen .empty { position: absolute; color: var(--muted); font-family: var(--mono); text-align: center; padding: 20px; }
.transport { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.transport input { flex: 1; }
.time { font-family: var(--mono); color: var(--muted); font-size: 13px; min-width: 110px; text-align: right; }
.status { color: var(--muted); font-size: 13px; font-family: var(--mono); margin-top: 10px; }
.error { color: #ff8a80; }
video, audio { display: none; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 13px; }
h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 28px 0 8px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>glyph<span>cast</span></h1>
      <p class="tagline">Видео цветными символами прямо в браузере, на WebGL2</p>
    </div>
    <nav>
      <a href="https://github.com/MrProLopstar/glyphcast">GitHub</a>
      <a href="https://www.npmjs.com/package/glyphcast">npm</a>
    </nav>
  </header>

  <div class="bar">
    <label class="button">Открыть видео<input id="file" type="file" accept="video/*"></label>
    <button id="sample" type="button">Пример .gcast</button>
    <button id="camera" type="button">Камера</button>
  </div>

  <section class="panel">
    <div class="controls">
      <label>Ширина сетки <output id="cols-value">160</output><input id="cols" type="range" min="40" max="320" step="4" value="160"></label>
      <label>Насыщенность <output id="boost-value">1.3</output><input id="boost" type="range" min="0" max="2.5" step="0.05" value="1.3"></label>
      <label>Символы
        <select id="glyphs">
          <option value=" .:-=+*#%@">Классика</option>
          <option value=" ░▒▓█">Блоки</option>
          <option value=" .'`^,:;Il!i~+_-?][}{1)(|tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$">Плотные</option>
          <option value=" 01">Двоичные</option>
        </select>
      </label>
      <label>Цвет
        <select id="tint">
          <option value="">Как в видео</option>
          <option value="#33ff66">Матрица</option>
          <option value="#ffb35c">Ламповый</option>
          <option value="#e8ecef">Монохром</option>
        </select>
      </label>
      <label><span><input id="auto" type="checkbox" checked> Автояркость и контраст</span></label>
    </div>
    <div class="screen" id="screen">
      <canvas id="canvas"></canvas>
      <div class="empty" id="empty">Откройте видео, включите камеру или запустите пример</div>
    </div>
    <div class="transport">
      <button id="play" type="button">▶</button>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span class="time" id="time">0:00 / 0:00</span>
      <button id="full" type="button">⛶</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <h2>Установка</h2>
  <pre>npm install glyphcast</pre>
  <video id="video" playsinline crossorigin="anonymous"></video>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
